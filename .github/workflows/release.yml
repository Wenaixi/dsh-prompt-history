name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  # 不加 id-token: write：pnpm 看到 OIDC 权限就会优先走 token exchange，
  # 而本包没配 Trusted Publisher 时那一步返回 404，且失败后不会再回落到
  # .npmrc 里的 NPM_TOKEN。用经典 token 发布就不需要 OIDC。

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: node --experimental-strip-types --test test/*.test.ts
      - run: pnpm build
      # pnpm publish 不认 NODE_AUTH_TOKEN（那是 npm CLI 的约定），必须显式写进
      # .npmrc；否则它会去走 OIDC token exchange，而本包没配 Trusted Publisher
      # 时那一步返回 404（ERR_PNPM_AUTH_TOKEN_EXCHANGE）。
      - name: Publish to npm
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::缺少 NPM_TOKEN secret，无法发布" >&2
            exit 1
          fi
          # setup-node 会把 NPM_CONFIG_USERCONFIG 指向它自己创建的临时 .npmrc，
          # npm 实际读的是那个文件。只写 $HOME/.npmrc 不会生效——这正是本仓
          # 之前一直 404 的原因（ponytail 写两个路径所以成功）。
          NPMRC="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$NPMRC"
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$HOME/.npmrc"
          npm publish --access public --registry=https://registry.npmjs.org/
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: gh release create ${{ github.ref_name }} --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
