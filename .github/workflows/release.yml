name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: node --experimental-strip-types --test test/*.test.ts
      - run: pnpm build
      # pnpm publish 不认 NODE_AUTH_TOKEN（那是 npm CLI 的约定），必须显式写进
      # .npmrc；否则它会去走 OIDC token exchange，而本包没配 Trusted Publisher
      # 时那一步返回 404（ERR_PNPM_AUTH_TOKEN_EXCHANGE）。
      - name: Publish to npm
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::缺少 NPM_TOKEN secret，无法发布" >&2
            exit 1
          fi
          echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > "$HOME/.npmrc"
          pnpm publish --no-git-checks --registry=https://registry.npmjs.org/
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: gh release create ${{ github.ref_name }} --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
